[project]
name = "Anas_bellaouali_workspace"
version = "0.1.0"
description = "Interactive TSP dashboard using Streamlit – compare and visualize algorithms like Nearest Neighbor, Simulated Annealing, and 2-opt."
requires-python = ">=3.11"
dependencies = [
    "folium>=0.19.5",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "streamlit-folium>=0.25.0",
    "streamlit>=1.44.1",
]
